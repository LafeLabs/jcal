function setup() {
    squarewidth = 100;
    if(innerWidth > innerHeight){
        squarewidth = innerHeight - 10;
    }
    else{
        squarewidth = innerWidth - 10;
    }
    createCanvas(squarewidth,squarewidth);

    phasewave = ecaldata.short_phase;
    plotphasebig();
}

function draw(){
    
}

document.getElementById("shortbutton").onclick = function(){
    phasewave = ecaldata.short_phase;
//    plotstandardmag();
}

function plotphasebig(){
    clear();
    background("white");
    noFill();
    strokeWeight(4);
    stroke(0);
    line(0,map(-100000,-300000,180,height,0),width,map(-100000,-300000,180,height,0));
    line(0,map(-200000,-300000,180,height,0),width,map(-200000,-300000,180,height,0));    
    fill(0);
    strokeWeight(1);
    textSize(30);
    text("- 100,000 deg",width - 200,0.33*height - 15);
    text("- 200,000 deg",width - 200,0.66*height - 15);
    noFill();
    strokeWeight(4);
    stroke("blue");
    beginShape();
    for(var index = 0; index < ecaldata.fghz.length; index++){
        vertex(map(index,0,ecaldata.fghz.length,0,width),map(phasewave[index],-300000,180,height,0));
    }
    endShape();
}


codesquaresize = 170;
marginsize = 40;
fontsize = 12;
//globalurl = "http://www.trashrobot.org/qrcode.html";
globalurl = window.location.href;
qrcode = new QRCode(document.getElementById("qrcode"), {
	text: globalurl,
	width: codesquaresize,
	height: codesquaresize,
	colorDark : "#000000",
	colorLight : "#ffffff",
	correctLevel : QRCode.CorrectLevel.H
});
