<script>


cal = false;
phase = true;


function setup() {
    squarewidth = 100;
    if(innerWidth > innerHeight){
        squarewidth = innerHeight - 10;
    }
    else{
        squarewidth = innerWidth - 10;
    }
    createCanvas(squarewidth,squarewidth);

    plotphasebig();
    plotphasesmall();
}

function draw(){
    
}

phasemaxcal =2000;
phasemincal = -2000;

function plotphasesmall(){
    clear();
    background("white");
    noFill();
    strokeWeight(4);
    stroke(0);
//    line(0,map(-100000,-300000,180,height,0),width,map(-100000,-300000,180,height,0));
  //  line(0,map(-200000,-300000,180,height,0),width,map(-200000,-300000,180,height,0));    
    fill(0);
    strokeWeight(1);
    textSize(30);

    noFill();
    strokeWeight(4);
    stroke("red");
    beginShape();
    for(var index = 0; index < ecaldata.fghz.length; index++){
        vertex(map(index,0,ecaldata.fghz.length,0,width),map(ecaldata.port1_phase_ecal[index],phasemincal,phasemaxcal,height,0));
    }
    endShape();
    stroke("orange");
    beginShape();
    for(var index = 0; index < ecaldata.fghz.length; index++){
        vertex(map(index,0,ecaldata.fghz.length,0,width),map(ecaldata.port2_phase_ecal[index],phasemincal,phasemaxcal,height,0));
    }
    endShape();    
    stroke("yellow");
    beginShape();
    for(var index = 0; index < ecaldata.fghz.length; index++){
        vertex(map(index,0,ecaldata.fghz.length,0,width),map(ecaldata.port3_phase_ecal[index],phasemincal,phasemaxcal,height,0));

    endShape();

    endShape();    
    stroke("purple");

        vertex(map(index,0,ecaldata.fghz.length,0,width),map(ecaldata.port6_phase_ecal[index],phasemincal,phasemaxcal,height,0));
    }
    endShape();    
}

function plotphasebig(){
    clear();
    background("white");
    noFill();
    strokeWeight(4);
    stroke(0);
    line(0,map(-100000,-300000,180,height,0),width,map(-100000,-300000,180,height,0));
    line(0,map(-200000,-300000,180,height,0),width,map(-200000,-300000,180,height,0));    
    fill(0);
    strokeWeight(4);
    textSize(30);
    text("- 100,000 deg",width - 200,0.33*height - 15);
    text("- 200,000 deg",width - 200,0.66*height - 15);
    noFill();
    strokeWeight(1);
    stroke("red");
    beginShape();
    for(var index = 0; index < ecaldata.fghz.length; index++){
        vertex(map(index,0,ecaldata.fghz.length,0,width),map(ecaldata.port1_phase_raw[index],-300000,180,height,0));
    }
    endShape();
    stroke("orange");
    beginShape();
    for(var index = 0; index < ecaldata.fghz.length; index++){
        vertex(map(index,0,ecaldata.fghz.length,0,width),map(ecaldata.port2_phase_raw[index],-300000,180,height,0));

        vertex(map(index,0,ecaldata.fghz.length,0,width),map(ecaldata.port6_phase_raw[index],-300000,180,height,0));
    }
    endShape();    
}


codesquaresize = 170;
